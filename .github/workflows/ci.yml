name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build (spotlessCheck, Error Prone, -Werror, unit tests)
        run: ./gradlew build --console=plain
      - name: Fail closed if no unit-test results were produced
        run: test -n "$(ls build/test-results/test/*.xml 2>/dev/null)"
      - name: GameTests
        run: ./gradlew runGameTestServer --console=plain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: pre-commit hooks (all files)
        uses: pre-commit/action@v3.0.1
      - name: Conventional commit messages
        # b441228 is the last pre-gitlint commit (the spec); earlier history predates the rule.
        run: |
          pip install gitlint-core==0.19.1
          gitlint --commits b441228..HEAD

  version-tag:
    # Release tags only: the tag must name the version gradle.properties holds, so the two can't drift.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the gradle.properties version
        run: |
          manifest=$(sed -nE 's/^mod_version=(.*)$/\1/p' gradle.properties)
          if [ "v${manifest}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match gradle.properties version ${manifest}." >&2
            exit 1
          fi
