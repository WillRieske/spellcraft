plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
    id 'jacoco'
    id 'com.diffplug.spotless' version '8.10.3'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'info.solidsoft.pitest' version '1.19.0'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // Launches the GameTest server, runs every registered test, exits non-zero on failure.
        // With no tests registered it crashes by design (fail closed).
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'

    // jqwik 1.10.1 is built on JUnit Platform 1.14.x, so Jupiter is pinned to the matching 5.14.x.
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'net.jqwik:jqwik:1.10.1'
    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testImplementation 'org.assertj:assertj-core:3.27.7'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
    options.errorprone.disableWarningsInGeneratedCode = true
}

tasks.named('test', Test) {
    useJUnitPlatform()
    maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat('2.100.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// On demand: ./gradlew test jacocoTestReport
jacoco {
    toolVersion = '0.8.15'
}
tasks.named('jacocoTestReport', JacocoReport) {
    reports {
        xml.required = true
        html.required = true
    }
}

// On demand: ./gradlew pitest — mutation testing scoped to the pure core.
pitest {
    pitestVersion = '1.30.0'
    junit5PluginVersion = '1.2.3'
    targetClasses = ['io.github.willrieske.spellcraft.client.upsidedown.*', 'io.github.willrieske.spellcraft.spell.rules.*']
    targetTests = ['io.github.willrieske.spellcraft.client.upsidedown.*', 'io.github.willrieske.spellcraft.spell.rules.*']
    threads = Runtime.runtime.availableProcessors()
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
